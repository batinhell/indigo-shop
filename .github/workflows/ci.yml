name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # npm install (а не npm ci): package-lock.json рассинхронизирован с package.json,
        # ci требует строгого совпадения. install подтянет недостающее и не упадёт на дрейфе.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint
